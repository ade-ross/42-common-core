;=====================================
; php-fpm.conf — WordPress container
;=====================================

[global]
pid = /run/php/php8.2-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

; Optional: tweak process management for small containers
; dynamic = spawns workers as needed
; static = fixed number of workers
; ondemand = starts workers when needed, kills after idle
; dynamic is best for WordPress
[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Log and environment settings
catch_workers_output = yes
env[WORDPRESS_DB_HOST] = mariadb
env[WORDPRESS_DB_USER] = $WORDPRESS_DB_USER
env[WORDPRESS_DB_PASSWORD] = $WORDPRESS_DB_PASSWORD
env[WORDPRESS_DB_NAME] = wordpress

; Recommended PHP settings for WordPress
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 300
php_admin_flag[log_errors] = on
