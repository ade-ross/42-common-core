server {
    listen 443 ssl;
    server_name ade-ross.42.fr;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Only allow TLS 1.2 and 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Send .php requests to the WordPress container (PHP-FPM)
    location ~ \.php$ {
	try_files $uri =404;	
        include fastcgi_params;
        fastcgi_pass wordpress:9000;  # service name from docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    # Portainer 
    location /portainer/ {
    proxy_pass https://portainer:9443/;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /adminer/ {
    proxy_pass http://adminer:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    # security headers
    proxy_http_version 1.1; 
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

}

server {
    listen 443 ssl;
    server_name static-ade-ross.42.fr;

    # SSL certificate for this domain
    ssl_certificate /etc/nginx/ssl/static.crt;
    ssl_certificate_key /etc/nginx/ssl/static.key;

    # Only allow TLS 1.2 and 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/static-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    #  deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
